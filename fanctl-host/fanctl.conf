# /etc/fanctl.conf - GPU blower controller
# Lines are key = value; '#' starts a comment. Unset keys use the defaults shown.

port = /dev/fanctl          # udev symlink (see 99-fanctl.rules)
interval = 2                # seconds between updates; must be < 10
ramp_down = 3               # max duty decrease per update, %
fail_duty = 100             # duty for a blower whose GPU can't be read

# Each K80 shows up as two GPUs in nvidia-smi / NVML.
# Check the order with: nvidia-smi -L   (and nvidia-smi -q | grep -i bus)
fan1_gpus = 0,1             # "none" = blower not fitted (duty 0)
fan2_gpus = 2,3

# temp_C:duty_% points, ascending; linear between points, flat outside.
# The controller maps the duty onto three blower speeds (chopped 12 V only
# gives a few distinct speeds on the BFB1012HH):
#   below 50 %  -> LOW  30 %  (~1300 rpm)
#   50-89 %     -> MID  70 %  (~2000 rpm)
#   90 % and up -> HIGH 100 % (~4200 rpm)
# (with a 5 % margin on the way down, so it doesn't flap at a threshold).
# K80s are passive: keep the first point above 0 so there is always airflow,
# even at idle (core temp under-reports memory/VRM heating).
# K80 throttles around 90C+; keep the core well under that.
fan1_curve = 40:35, 55:45, 70:70, 82:100
fan2_curve = 40:35, 55:45, 70:70, 82:100

# Minimum running duty and tach / stall recovery are stored in the controller:
#   fanctl -s CFG               show them
#   fanctl -s "MIN 35 35"       floor under the LOW speed, % per blower
#   fanctl -s "TACH 1 1"        1 = tach wired (stall recovery on), 0 = none
