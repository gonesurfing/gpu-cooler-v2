# /etc/fanctl.conf - GPU blower controller
# Lines are key = value; '#' starts a comment. Unset keys use the defaults shown.

port = /dev/fanctl          # udev symlink (see 99-fanctl.rules)
interval = 2                # seconds between updates; must be < 10
ramp_down = 3               # max duty decrease per update, %
fail_duty = 100             # duty for a blower whose GPU can't be read
stall_min_duty = 30         # warn if duty >= this and tach reads 0 (0 = off)

# Each K80 shows up as two GPUs in nvidia-smi / NVML.
# Check the order with: nvidia-smi -L   (and nvidia-smi -q | grep -i bus)
fan1_gpus = 0,1             # "none" = blower not fitted (duty 0)
fan2_gpus = 2,3

# temp_C:duty_% points, ascending; linear between points, flat outside.
# K80 throttles around 90C+; keep the core well under that.
fan1_curve = 40:0, 50:30, 70:70, 82:100
fan2_curve = 40:0, 50:30, 70:70, 82:100

fan1_tach = 1               # 0 if the blower has no tach wire
fan2_tach = 1
